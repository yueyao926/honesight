services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lenscoach}
      POSTGRES_DB: lenscoach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenscoach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-lenscoach}@db:5432/lenscoach
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-random-secret-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      BACKEND_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: uploads
      AI_ANALYSIS_MODE: ${AI_ANALYSIS_MODE:-api}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      AI_MODEL: ${AI_MODEL:-doubao-seed-1-6-vision-250815}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-doubao-seed-2-0-lite-260215}
      AI_PRACTICE_MODEL: ${AI_PRACTICE_MODEL:-}
      AI_PUBLIC_API_BASE_URL: ${AI_PUBLIC_API_BASE_URL:-}
      ANALYSIS_CACHE_TTL_HOURS: ${ANALYSIS_CACHE_TTL_HOURS:-720}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      AI_FAST_TIMEOUT_SECONDS: ${AI_FAST_TIMEOUT_SECONDS:-8}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_URL: ${ARK_API_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      ARK_VISION_MODEL: ${ARK_VISION_MODEL:-doubao-seed-1-6-vision-250815}
      MESSAGE_IMAGE_MAX_SIZE: ${MESSAGE_IMAGE_MAX_SIZE:-8388608}
      MESSAGE_RATE_LIMIT: ${MESSAGE_RATE_LIMIT:-20}
      MESSAGE_REQUEST_DAILY_LIMIT: ${MESSAGE_REQUEST_DAILY_LIMIT:-10}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-24}
      SEARCH_SEMANTIC_ENABLED: ${SEARCH_SEMANTIC_ENABLED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      TEXT_EMBEDDING_MODEL: ${TEXT_EMBEDDING_MODEL:-}
      IMAGE_EMBEDDING_MODEL: ${IMAGE_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-0}
      IMAGE_CAPTION_ENABLED: ${IMAGE_CAPTION_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # 同源部署，API 通过 nginx 反向代理，无需跨域
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
