name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenscoach-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: honesight-backend
  FRONTEND_IMAGE: honesight-frontend

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build backend image
        run: docker build --tag "${BACKEND_IMAGE}:ci" ./backend

      - name: Run backend tests
        run: |
          docker run --rm "${BACKEND_IMAGE}:ci" sh -c \
            "pip install --no-cache-dir pytest >/dev/null && python -m pytest -q"

      - name: Build frontend image
        run: docker build --tag "${FRONTEND_IMAGE}:ci" ./frontend

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Package release source
        shell: bash
        run: |
          set -euo pipefail
          release_dir="release/${GITHUB_SHA}"
          mkdir -p "$release_dir"
          cp -R backend frontend "$release_dir/"
          cp docker-compose.release.yml "$release_dir/docker-compose.yml"
          cp deployment/deploy-production.sh "$release_dir/deploy-production.sh"
          chmod +x "$release_dir/deploy-production.sh"
          (
            cd "$release_dir"
            find backend frontend -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum docker-compose.yml deploy-production.sh
          ) > "$release_dir/SHA256SUMS"
          tar --create --gzip --file release/lenscoach-source.tar.gz --directory "$release_dir" .
          (cd release && sha256sum lenscoach-source.tar.gz > SOURCE_SHA256SUM)

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Upload release source
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          remote_release="/home/${SERVER_USER}/lenscoach/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SERVER_PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '$remote_release'"
          scp -i ~/.ssh/id_ed25519 -P "$SERVER_PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            release/lenscoach-source.tar.gz release/SOURCE_SHA256SUM \
            "${SERVER_USER}@${SERVER_HOST}:${remote_release}/"

      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          remote_release="/home/${SERVER_USER}/lenscoach/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SERVER_PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "cd '$remote_release' && sha256sum --check SOURCE_SHA256SUM && tar --extract --gzip --file lenscoach-source.tar.gz && chmod +x deploy-production.sh && bash deploy-production.sh '$GITHUB_SHA'"
