name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: lenscoach-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Resolve release version
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release source
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          release_dir="release/${RELEASE_SHA}"
          mkdir -p "$release_dir"

          cp -R backend frontend "$release_dir/"
          cp docker-compose.release.yml "$release_dir/docker-compose.yml"
          cp deployment/deploy-production.sh "$release_dir/deploy-production.sh"
          chmod +x "$release_dir/deploy-production.sh"
          (
            cd "$release_dir"
            find backend frontend -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
            sha256sum docker-compose.yml deploy-production.sh
          ) > "$release_dir/SHA256SUMS"

      - name: Upload release package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: release/${{ steps.release.outputs.sha }}
          target: /home/${{ secrets.SERVER_USER }}/lenscoach/releases
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: Activate release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -euo pipefail
            release_sha="${{ steps.release.outputs.sha }}"
            release_dir="$HOME/lenscoach/releases/$release_sha"
            test -d "$release_dir"
            chmod +x "$release_dir/deploy-production.sh"
            "$release_dir/deploy-production.sh" "$release_sha"
