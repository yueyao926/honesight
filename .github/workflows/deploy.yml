name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenscoach-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: lenscoach-backend
  FRONTEND_IMAGE: lenscoach-frontend

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build backend image
        run: docker build --tag "${BACKEND_IMAGE}:ci" ./backend

      - name: Run backend tests
        run: |
          docker run --rm "${BACKEND_IMAGE}:ci" sh -c \
            "pip install --no-cache-dir pytest >/dev/null && python -m pytest -q"

      - name: Build frontend image
        run: docker build --tag "${FRONTEND_IMAGE}:ci" ./frontend

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build release images
        run: |
          docker build --tag "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend
          docker build --tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend

      - name: Package release
        run: |
          mkdir -p release
          docker save \
            "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            | gzip -1 > release/lenscoach-images.tar.gz
          cp docker-compose.prod.yml release/docker-compose.prod.yml
          cp .github/scripts/deploy-production.sh release/deploy-production.sh
          chmod +x release/deploy-production.sh
          (cd release && sha256sum lenscoach-images.tar.gz docker-compose.prod.yml deploy-production.sh > SHA256SUMS)

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Upload release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          remote_release="/home/${SERVER_USER}/lenscoach/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SERVER_PORT" \
            "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '$remote_release'"
          scp -i ~/.ssh/id_ed25519 -P "$SERVER_PORT" \
            release/lenscoach-images.tar.gz \
            release/docker-compose.prod.yml \
            release/deploy-production.sh \
            release/SHA256SUMS \
            "${SERVER_USER}@${SERVER_HOST}:${remote_release}/"

      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          remote_script="/home/${SERVER_USER}/lenscoach/releases/${GITHUB_SHA}/deploy-production.sh"
          ssh -i ~/.ssh/id_ed25519 -p "$SERVER_PORT" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "bash '$remote_script' '$GITHUB_SHA'"
