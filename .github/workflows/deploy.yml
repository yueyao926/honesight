name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署的分支'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器并执行部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            # 首次部署：如果目录不存在则克隆
            if [ ! -d ~/lenscoach ]; then
              git clone https://github.com/yueyao926/lenscoach.git ~/lenscoach
            fi

            cd ~/lenscoach
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            # 如果 .env 不存在，从模板创建（需要先在服务器填好真实值）
            if [ ! -f .env ]; then
              cp .env.production.example .env
              echo "⚠️  .env 文件不存在，已从模板复制，请立即修改密码和密钥！"
            fi

            docker compose -f docker-compose.deploy.yml up -d --build

            # Docker 前端可能因宿主机 Nginx 占用 80 端口而映射到其他端口。
            # 自动读取实际端口，并确保公网入口代理到 LensCoach，而不是默认欢迎页。
            FRONTEND_BIND="$(docker compose -f docker-compose.deploy.yml port frontend 80 | tail -n 1)"
            FRONTEND_PORT="${FRONTEND_BIND##*:}"
            if [ -z "$FRONTEND_PORT" ]; then
              echo "❌ 无法获取前端容器映射端口"
              exit 1
            fi

            curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" | grep -q 'id="root"'

            if command -v nginx >/dev/null 2>&1; then
              if ! sudo -n true; then
                echo "❌ 部署用户没有免密 sudo 权限，无法更新宿主机 Nginx"
                exit 1
              fi
              sudo tee /etc/nginx/conf.d/lenscoach.conf >/dev/null <<EOF
            server {
                listen 80;
                server_name ${{ secrets.SERVER_HOST }};

                location / {
                    proxy_pass http://127.0.0.1:${FRONTEND_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOF
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            curl -fsS -H "Host: ${{ secrets.SERVER_HOST }}" http://127.0.0.1/ | grep -q 'id="root"'
            docker compose -f docker-compose.deploy.yml ps
            docker image prune -f
