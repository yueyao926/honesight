services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lenscoach}
      POSTGRES_DB: lenscoach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenscoach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: lenscoach-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      BACKEND_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: uploads
      AI_ANALYSIS_MODE: ${AI_ANALYSIS_MODE:-api}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      AI_MODEL: ${AI_MODEL:-doubao-seed-1-6-vision-250815}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_URL: ${ARK_API_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      ARK_VISION_MODEL: ${ARK_VISION_MODEL:-doubao-seed-1-6-vision-250815}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: lenscoach-frontend:latest
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
