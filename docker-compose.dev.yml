services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lenscoach
      POSTGRES_DB: lenscoach
    volumes:
      - lenscoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenscoach"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lenscoach_pgdata:
