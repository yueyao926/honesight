services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HoneSight
      POSTGRES_DB: HoneSight
    volumes:
      - HoneSight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HoneSight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  HoneSight_pgdata:
