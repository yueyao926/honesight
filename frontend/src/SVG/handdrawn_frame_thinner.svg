    <path d="M923 320
             C925 335, 923 349, 924 362
             C924 375, 925 389, 924 402"
          stroke-width="5.07"/>
    <path d="M923 425
             C923 432, 922 440, 922 446"
          stroke-width="5.85"/>

    <!-- BOTTOM: noticeably more imperfect than geometric -->
    <path d="M205 445
             C219 447, 234 445, 248 446
             C262 445, 274 446, 289 445"
          stroke-width="5.46"/>
    <path d="M326 445
             C340 444, 354 446, 368 445
