          stroke-width="5.62"/>
    <path d="M819 445
             C836 443, 852 445, 870 444"
          stroke-width="5.07"/>

    <!-- slight overdraw / sketch ghost lines -->
    <path d="M185 82 C218 79, 249 78, 287 77" stroke-width="1.17" opacity=".32"/>
    <path d="M160 126 C157 153, 158 181, 157 204" stroke-width="1.01" opacity=".25"/>
    <path d="M923 90 C925 119, 923 145, 925 169" stroke-width="1.09" opacity=".28"/>
    <path d="M205 448 C233 449, 261 447, 289 448" stroke-width="1.17" opacity=".30"/>
