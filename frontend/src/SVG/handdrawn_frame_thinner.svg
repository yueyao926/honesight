<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <title>Organic hand-drawn dashed frame</title>
  <desc>Loose irregular hand-drawn dashed rectangular frame with imperfect spacing and jitter.</desc>

  <g fill="none" stroke="#2b2926" stroke-linecap="round" stroke-linejoin="round">

    <!-- TOP: intentionally uneven lengths, angles and thickness -->
    <path d="M186 79
             C206 76, 224 78, 247 75
             C262 73, 274 74, 287 74"
          stroke-width="5.30"/>
    <path d="M323 72
             C339 70, 351 69, 365 70
