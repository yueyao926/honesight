  <defs>
    <radialGradient id="bulbGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(223 258) rotate(90) scale(180 180)">
      <stop offset="0" stop-color="#FFF9B0" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FFE66B" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#FFD84A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFD84A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(223 254) rotate(90) scale(72 72)">
      <stop offset="0" stop-color="#FFFDE1" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFF59D" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFF59D" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.98  0 1 0 0 0.85  0 0 1 0 0.25  0 0 0 1 0" result="warmGlow"/>
      <feMerge>
        <feMergeNode in="warmGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- soft ambient glow inside and around the bulb -->
  <circle cx="223" cy="258" r="165" fill="url(#bulbGlow)"/>
  <circle cx="223" cy="254" r="62" fill="url(#starGlow)" filter="url(#innerGlow)"/>

