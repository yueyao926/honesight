services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      REFRESH_TOKEN_REUSE_GRACE_SECONDS: ${REFRESH_TOKEN_REUSE_GRACE_SECONDS:-30}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lenscoach_refresh}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      BACKEND_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-HoneSight <noreply@honesight.app>}"
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_VERIFICATION_EXPIRE_MINUTES: ${EMAIL_VERIFICATION_EXPIRE_MINUTES:-1440}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      UPLOAD_DIR: uploads
      AI_ANALYSIS_MODE: ${AI_ANALYSIS_MODE:-api}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      AI_MODEL: ${AI_MODEL:-doubao-seed-1-6-vision-250815}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-doubao-seed-2-0-lite-260215}
      AI_PRACTICE_MODEL: ${AI_PRACTICE_MODEL:-}
      AI_PUBLIC_API_BASE_URL: ${AI_PUBLIC_API_BASE_URL:-}
      ANALYSIS_CACHE_TTL_HOURS: ${ANALYSIS_CACHE_TTL_HOURS:-720}
      UPLOAD_CLEANUP_ENABLED: ${UPLOAD_CLEANUP_ENABLED:-true}
      UPLOAD_CLEANUP_INTERVAL_HOURS: ${UPLOAD_CLEANUP_INTERVAL_HOURS:-12}
      UPLOAD_CLEANUP_STARTUP_DELAY_SECONDS: ${UPLOAD_CLEANUP_STARTUP_DELAY_SECONDS:-30}
      ANALYSIS_IMAGE_RETENTION_HOURS: ${ANALYSIS_IMAGE_RETENTION_HOURS:-72}
      GENERATED_IMAGE_RETENTION_HOURS: ${GENERATED_IMAGE_RETENTION_HOURS:-168}
      PRACTICE_IMAGE_RETENTION_DAYS: ${PRACTICE_IMAGE_RETENTION_DAYS:-30}
      ORPHAN_IMAGE_RETENTION_HOURS: ${ORPHAN_IMAGE_RETENTION_HOURS:-72}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      AI_FAST_TIMEOUT_SECONDS: ${AI_FAST_TIMEOUT_SECONDS:-8}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_URL: ${ARK_API_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      ARK_VISION_MODEL: ${ARK_VISION_MODEL:-doubao-seed-1-6-vision-250815}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
